spring.application.name=raven

# Perfiles activos: dev (configuracion de desarrollo) y local (clave secreta, ignorada por Git)
spring.profiles.active=dev, local

# LangChain4j / Gemini (valores comunes)
langchain4j.google-ai-gemini.chat-model.model-name=gemini-2.5-flash
# La clave real va en application-local.properties o en la variable de entorno GEMINI_API_KEY
langchain4j.google-ai-gemini.chat-model.api-key=${GEMINI_API_KEY:}
